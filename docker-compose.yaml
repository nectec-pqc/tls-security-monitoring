name: tlssec

x-tlssec-base-service: &tlssec-base-service
  image: tlssec
  pull_policy: never
  build:
    context: .
  entrypoint:
  - sh
  depends_on:
    db:
      condition: service_healthy

services:
  cli: *tlssec-base-service
  dev-cli:
    <<: *tlssec-base-service
    image: tlssec:dev
    build:
      context: .
      target: dev
    # Mount source code for live editing
    volumes:
    - ./src:/opt/app/src
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_PASSWORD: local-test-password-PZ9dVzwew3Xe
      POSTGRES_DB: tlssec
    volumes:
    - db:/var/lib/postgresql
    healthcheck:
      test:
      - CMD
      - pg_isready
      - --username=postgres
      interval: 1s
      timeout: 15s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.local
      PGADMIN_DEFAULT_PASSWORD: local-test-password-FKl7sfIpbEpD
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGPASS_FILE: /config/pgpass
    configs:
    - source: pgadmin-servers
      target: /pgadmin4/servers.json
      mode: 0444
    - source: pgadmin-pgpass
      target: /config/pgpass
      uid: "5050"
      gid: "5050"
      mode: 0400
    volumes:
    - pgadmin:/var/lib/pgadmin
    ports:
    - 8080:80
    links:
    - db


configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "local tlssec database",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "tlssec",
            "Username": "postgres",
            "PassFile": "/config/pgpass"
          }
        }
      }
  pgadmin-pgpass:
    content: |
      db:5432:*:postgres:local-test-password-PZ9dVzwew3Xe


volumes:
  db:
  pgadmin:


