name: tlssec

x-tlssec-base-service: &tlssec-base-service
  image: tlssec
  pull_policy: never
  build:
    context: .
  entrypoint:
  - bash
  environment: &tlssec-env
    HISTFILE: /opt/app/workdir/.bash_history
    PYTHON_HISTORY: /opt/app/workdir/.python_history
    TLSSEC_DB__HOST: db
    TLSSEC_DB__PASSWORD: local-test-password-PZ9dVzwew3Xe
  volumes:
  # Persist working directory
  - ./workdir:/opt/app/workdir
  depends_on:
    init:
      condition: service_completed_successfully

services:
  cli:
    <<: *tlssec-base-service
    profiles:
    - cli
  dev-cli:
    <<: *tlssec-base-service
    image: tlssec:dev
    build:
      context: .
      target: dev
    environment:
      <<: *tlssec-env
      TLSSEC_DEPLOYMENT_MODE: development
    volumes:
    - ./workdir:/opt/app/workdir
    # Mount source code for live editing
    - ./src:/opt/app/src
    profiles:
    - cli
  init:
    <<: *tlssec-base-service
    entrypoint:
    - tlssec
    - init
    depends_on:
      db:
        condition: service_healthy
  analysis:
    image: quay.io/jupyter/scipy-notebook:2026-05-04
    ports:
    - 8888:8888
    working_dir: /home/jovyan/work
    volumes:
    - ./workdir:/home/jovyan/work
    - ./src:/opt/app/src
    environment:
      <<: *tlssec-env
      TLSSEC_DEPLOYMENT_MODE: development
    profiles:
    - analysis
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_PASSWORD: local-test-password-PZ9dVzwew3Xe
      POSTGRES_DB: tlssec
    volumes:
    - db:/var/lib/postgresql
    healthcheck:
      test:
      - CMD
      - pg_isready
      - --username=postgres
      interval: 1s
      timeout: 15s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.local
      PGADMIN_DEFAULT_PASSWORD: local-test-password-FKl7sfIpbEpD
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGPASS_FILE: /config/pgpass
    configs:
    - source: pgadmin-servers
      target: /pgadmin4/servers.json
      mode: 0444
    - source: pgadmin-pgpass
      target: /config/pgpass
      uid: "5050"
      gid: "5050"
      mode: 0400
    volumes:
    - pgadmin:/var/lib/pgadmin
    ports:
    - 8080:80
    links:
    - db


configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "local tlssec database",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "tlssec",
            "Username": "postgres",
            "PassFile": "/config/pgpass"
          }
        }
      }
  pgadmin-pgpass:
    content: |
      db:5432:*:postgres:local-test-password-PZ9dVzwew3Xe


volumes:
  db:
  pgadmin:


