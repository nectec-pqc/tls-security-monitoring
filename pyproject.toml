[project]
name = "tlssec"
version = "0.1.0"
description = "TLS security monitoring toolkit"
readme = "README.md"
authors = [
    { name = "Apiwat Chantawibul", email = "billiska@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
tlssec = "tlssec.cli:cli"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
cache_dir = "./workdir"
